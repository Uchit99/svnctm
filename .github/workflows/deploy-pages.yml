name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: |
          # Route handlers and live order confirmation require a Node.js server.
          # They stay in the repository for server-capable deployments, but are
          # excluded from this static GitHub Pages build.
          mkdir -p .pages-server-routes
          mv src/app/api .pages-server-routes/api
          mv src/app/order-confirmation .pages-server-routes/order-confirmation
          GITHUB_PAGES_PROJECT_SITE=true NEXT_PUBLIC_STATIC_SITE=true npm run build -- --webpack
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
